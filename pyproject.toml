[project]
name = "nessie-tutorials"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Trystan Lambert", email = "trystanscottlambert@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "astroquery>=0.4.11",
    "jupyter>=1.1.1",
    "nessie-py>=1.1.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]

[project.scripts]
nessie-tutorials = "nessie_tutorials:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
